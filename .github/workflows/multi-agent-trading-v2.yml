name: Multi-Agent Trading Cycle

# 2026-09-01: GitHub's own `schedule` trigger is NOT used here — see exit-management-v2.yml's
# comment on this same date for why. An external scheduler (cron-job.org) calls this workflow's
# `workflow_dispatch` endpoint every 15 minutes instead — see multi_agent/README.md's
# "Scheduled runs" section for the exact request configuration.

on:
  workflow_dispatch: {}

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and the Alpaca MCP server
        run: |
          pip install uv
          uv tool install alpaca-mcp-server
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run the multi-agent trading pipeline
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Without this, Python fully buffers stdout in CI (no TTY) — if the run hangs or gets
          # cancelled before its own end-of-script flush, every print() so far is lost with it,
          # including any trade that may have already gone through. Unbuffered means every line
          # lands in the log the instant it's printed, hang or not.
          PYTHONUNBUFFERED: "1"
        run: python multi_agent/orchestrator.py
