name: Exit Management Cycle

# Runs exit_manager.py alone — no universe scan, no new candidates — every 10 minutes during US
# market hours, separately from (and tighter than) the every-30-minutes full entry-scan cycle in
# multi-agent-trading-v2.yml (which also runs its own exit check at the end of each cycle).
# Protecting an already-open position from an adverse intraday move
# (stop-loss/take-profit/near-expiration) is more time-sensitive than finding new entries, so this
# job checks more often than the full pipeline does.
#
# 2026-09-03: widened from every 5 minutes (later settled at 10, briefly 15) after live evidence
# that Exit Management's traffic — running continuously throughout a Trading Cycle run that can
# itself take many minutes — competes with the Trading Cycle's own Groq calls for the same shared,
# organization-wide per-model rate-limit budget (Groq enforces these limits org-wide, not per API
# key). Less frequent firing shrinks how often the two schedules' calls land in the same 60-second
# window.
#
# 2026-09-01: GitHub's own `schedule` trigger is NOT used here — after a since-fixed syntax error
# was briefly pushed to an earlier version of this file, GitHub's cron registration got stuck and
# never resumed firing on its own, even across a disable/re-enable via the API and a rename to a
# fresh file path (this file). Rather than keep trusting GitHub's internal scheduler, an external
# scheduler (cron-job.org) calls this workflow's `workflow_dispatch` endpoint on a timer instead —
# see multi_agent/README.md's "Scheduled runs" section for the exact request configuration.

on:
  workflow_dispatch: {}

jobs:
  check-exits:
    runs-on: ubuntu-latest
    # See multi-agent-trading-v2.yml's comment on this — same reasoning applies here.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and the Alpaca MCP server
        run: |
          pip install uv
          uv tool install alpaca-mcp-server
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run exit management
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          # No GROQ_API_KEY here: exit_manager.py's whole call chain (market_conditions_agent.py +
          # trading_agent.py) is deterministic -- neither calls an LLM at all, so there's nothing
          # here for a Groq key (primary or the GROQ_API_KEY_EXITS secondary account, now used as
          # pipeline-wide overflow from multi-agent-trading-v2.yml instead — see
          # llm_tools.get_secondary_client) to do.
          # See multi-agent-trading-v2.yml's comment on this — same reasoning applies here.
          PYTHONUNBUFFERED: "1"
        run: python multi_agent/exit_manager.py
